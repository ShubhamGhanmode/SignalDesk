name: Build
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Go application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: signaldesk:ci
          cache-from: type=gha,scope=signaldesk
          cache-to: type=gha,mode=max,scope=signaldesk
      - name: Build brief service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/brief/Dockerfile
          push: false
          tags: signaldesk-brief:ci
          cache-from: type=gha,scope=brief
          cache-to: type=gha,mode=max,scope=brief
