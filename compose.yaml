name: signaldesk

x-app: &app
  image: signaldesk:local
  build: .
  restart: unless-stopped
  environment: &app-env
    HTTP_ADDR: :8080
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    POSTGRES_URL: postgres://signaldesk:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/signaldesk?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    CASSANDRA_HOSTS: cassandra:9042
    CASSANDRA_KEYSPACE: signaldesk
    KAFKA_BROKERS: kafka:9092
    OPENSEARCH_URL: http://opensearch:9200
    BRIEF_URL: http://brief:8090
    BRIEF_TOKEN: ${BRIEF_TOKEN:?set BRIEF_TOKEN}
    INGEST_PER_MINUTE: ${INGEST_PER_MINUTE:-6000}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: signaldesk
      POSTGRES_USER: signaldesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U signaldesk -d signaldesk"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, noeviction, --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      start_period: 20s
      retries: 20
    restart: unless-stopped

  cassandra:
    image: cassandra:5.0
    environment:
      CASSANDRA_CLUSTER_NAME: SignalDesk
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 128M
    volumes: [cassandra-data:/var/lib/cassandra]
    healthcheck:
      test: [CMD-SHELL, "cqlsh -e 'SELECT cluster_name FROM system.local' >/dev/null 2>&1"]
      interval: 15s
      start_period: 60s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - search-data:/usr/share/opensearch/data
      - ./deploy/compose/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      start_period: 30s
      retries: 30
    restart: unless-stopped

  init:
    <<: *app
    command: [init, --seed]
    restart: "no"
    environment:
      <<: *app-env
      DEMO_PASSWORD: ${DEMO_PASSWORD:?set DEMO_PASSWORD}
      DEMO_ACME_API_KEY: ${DEMO_ACME_API_KEY:?set DEMO_ACME_API_KEY}
      DEMO_NORTHSTAR_API_KEY: ${DEMO_NORTHSTAR_API_KEY:?set DEMO_NORTHSTAR_API_KEY}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      cassandra: {condition: service_healthy}
      opensearch: {condition: service_healthy}

  api:
    <<: *app
    command: [api]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      init: {condition: service_completed_successfully}
      brief: {condition: service_started}

  timeline-worker:
    <<: *app
    command: [worker, timeline]
    depends_on:
      init: {condition: service_completed_successfully}

  search-worker:
    <<: *app
    command: [worker, search]
    depends_on:
      init: {condition: service_completed_successfully}

  brief:
    image: signaldesk-brief:local
    build:
      context: .
      dockerfile: services/brief/Dockerfile
    environment:
      BRIEF_TOKEN: ${BRIEF_TOKEN:?set BRIEF_TOKEN}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    restart: unless-stopped

  simulator:
    image: python:3.12-slim
    profiles: [demo]
    volumes: [./tools:/tools:ro]
    environment:
      SIGNALDESK_API_KEY: ${DEMO_ACME_API_KEY:?set DEMO_ACME_API_KEY}
    command: [python, /tools/simulate.py, --url, http://api:8080, --scenario, --events, "250"]
    depends_on:
      api: {condition: service_started}

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  cassandra-data:
  search-data:
