apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: signaldesk
  region: eu-west-1
iam:
  withOIDC: true
managedNodeGroups:
  - name: application
    instanceType: m6i.large
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 30
    privateNetworking: true
addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
    attachPolicyARNs:
      - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy
