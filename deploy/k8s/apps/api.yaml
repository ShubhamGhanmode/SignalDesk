apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  selector: {app: signaldesk-api}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api}
spec:
  replicas: 2
  selector: {matchLabels: {app: signaldesk-api}}
  template:
    metadata:
      labels: {app: signaldesk-api}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /metrics}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: signaldesk:local
          args: [api]
          envFrom: [{configMapRef: {name: signaldesk-config}}]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: signaldesk-secrets, key: POSTGRES_PASSWORD}}
            - {name: POSTGRES_URL, value: "postgres://signaldesk:$(POSTGRES_PASSWORD)@postgres:5432/signaldesk?sslmode=disable"}
            - name: BRIEF_TOKEN
              valueFrom: {secretKeyRef: {name: signaldesk-secrets, key: BRIEF_TOKEN}}
          ports: [{containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          startupProbe: {httpGet: {path: /healthz, port: 8080}, failureThreshold: 60, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, periodSeconds: 10, timeoutSeconds: 6}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 20}
