apiVersion: v1
kind: Service
metadata: {name: brief}
spec:
  selector: {app: signaldesk-brief}
  ports: [{port: 8090, targetPort: 8090}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: brief}
spec:
  replicas: 1
  selector: {matchLabels: {app: signaldesk-brief}}
  template:
    metadata: {labels: {app: signaldesk-brief}}
    spec:
      serviceAccountName: signaldesk-brief
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: brief
          image: signaldesk-brief:local
          envFrom: [{configMapRef: {name: signaldesk-config}}]
          env:
            - name: BRIEF_TOKEN
              valueFrom: {secretKeyRef: {name: signaldesk-secrets, key: BRIEF_TOKEN}}
          ports: [{containerPort: 8090}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 384Mi}}
          readinessProbe: {httpGet: {path: /healthz, port: 8090}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8090}, initialDelaySeconds: 10, periodSeconds: 20}
