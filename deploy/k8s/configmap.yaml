apiVersion: v1
kind: ConfigMap
metadata:
  name: signaldesk-config
data:
  HTTP_ADDR: :8080
  PUBLIC_URL: http://localhost:8080
  COOKIE_SECURE: "false"
  REDIS_URL: redis://redis:6379/0
  CASSANDRA_HOSTS: cassandra:9042
  CASSANDRA_KEYSPACE: signaldesk
  KAFKA_BROKERS: kafka:9092
  KAFKA_PARTITIONS: "6"
  KAFKA_REPLICATION: "1"
  OPENSEARCH_URL: http://opensearch:9200
  BRIEF_URL: http://brief:8090
  INGEST_PER_MINUTE: "6000"
  AWS_REGION: eu-west-1
  BEDROCK_MODEL_ID: ""
