apiVersion: v1
kind: Service
metadata: {name: cassandra}
spec:
  selector: {app: cassandra}
  ports: [{port: 9042, targetPort: 9042}]
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: cassandra}
spec:
  serviceName: cassandra
  replicas: 1
  selector: {matchLabels: {app: cassandra}}
  template:
    metadata: {labels: {app: cassandra}}
    spec:
      containers:
        - name: cassandra
          image: cassandra:5.0
          env:
            - {name: CASSANDRA_CLUSTER_NAME, value: SignalDesk}
            - {name: CASSANDRA_DC, value: datacenter1}
            - {name: CASSANDRA_ENDPOINT_SNITCH, value: GossipingPropertyFileSnitch}
            - {name: MAX_HEAP_SIZE, value: 768M}
            - {name: HEAP_NEWSIZE, value: 128M}
          ports: [{containerPort: 9042}]
          resources: {requests: {cpu: 500m, memory: 1536Mi}, limits: {cpu: "2", memory: 2Gi}}
          readinessProbe:
            exec: {command: [sh, -c, "cqlsh -e 'SELECT cluster_name FROM system.local' >/dev/null"]}
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts: [{name: data, mountPath: /var/lib/cassandra}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
