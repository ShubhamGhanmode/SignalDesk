apiVersion: v1
kind: ConfigMap
metadata: {name: opensearch-config}
data:
  opensearch.yml: |
    cluster.name: signaldesk
    node.name: signaldesk-search
    network.host: 0.0.0.0
    discovery.type: single-node
    plugins.security.disabled: true
    node.store.allow_mmap: false
---
apiVersion: v1
kind: Service
metadata: {name: opensearch}
spec:
  selector: {app: opensearch}
  ports: [{port: 9200, targetPort: 9200}]
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: opensearch}
spec:
  serviceName: opensearch
  replicas: 1
  selector: {matchLabels: {app: opensearch}}
  template:
    metadata: {labels: {app: opensearch}}
    spec:
      securityContext: {fsGroup: 1000}
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.19.1
          env:
            - {name: DISABLE_INSTALL_DEMO_CONFIG, value: "true"}
            - {name: DISABLE_SECURITY_PLUGIN, value: "true"}
            - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms512m -Xmx512m"}
          ports: [{containerPort: 9200}]
          resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 1536Mi}}
          readinessProbe:
            httpGet: {path: /_cluster/health, port: 9200}
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /usr/share/opensearch/data}
            - {name: config, mountPath: /usr/share/opensearch/config/opensearch.yml, subPath: opensearch.yml, readOnly: true}
      volumes: [{name: config, configMap: {name: opensearch-config}}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
