apiVersion: batch/v1
kind: Job
metadata: {name: signaldesk-init}
spec:
  backoffLimit: 8
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: init
          image: signaldesk:local
          args: [init, --seed]
          envFrom: [{configMapRef: {name: signaldesk-config}}]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: signaldesk-secrets, key: POSTGRES_PASSWORD}}
            - {name: POSTGRES_URL, value: "postgres://signaldesk:$(POSTGRES_PASSWORD)@postgres:5432/signaldesk?sslmode=disable"}
            - name: DEMO_PASSWORD
              valueFrom: {secretKeyRef: {name: signaldesk-secrets, key: DEMO_PASSWORD}}
            - name: DEMO_ACME_API_KEY
              valueFrom: {secretKeyRef: {name: signaldesk-secrets, key: DEMO_ACME_API_KEY}}
            - name: DEMO_NORTHSTAR_API_KEY
              valueFrom: {secretKeyRef: {name: signaldesk-secrets, key: DEMO_NORTHSTAR_API_KEY}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
